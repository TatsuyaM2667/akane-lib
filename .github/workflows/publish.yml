name: Publish Package & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-npm:
    name: Publish to npmjs.org
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update npm CLI for Trusted Publishing (OIDC)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --provenance --access public

  create-release:
    name: Create GitHub Release
    needs: publish-npm
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Installation
            ```bash
            npm install @tatsuyamiura2667/akane-lib@${{ github.ref_name }}
            ```

            ## Links
            - **Live Demo**: https://TatsuyaM2667.github.io/akane-lib/
            - **Storybook Catalog**: https://TatsuyaM2667.github.io/akane-lib/storybook/
